<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Resultados de un municipio en las elecciones municipales: concejales, secciones censales y resultado del cabildo insular.">
<title>Resultados por municipio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="sitetitle"><a href="index.html">Elecciones municipales</a></div>
  <div class="topbar"><nav class="crumbs" id="crumbs" aria-label="Migas de pan"></nav></div>
  <div id="bar"></div>
  <div class="switch" id="sw" role="group" aria-label="Tipo de elección" hidden></div>
  <nav class="tabs" role="tablist" aria-label="Secciones" id="tabs"><button type="button" role="tab" id="tab-mun" aria-controls="p-mun" aria-selected="true">Municipio</button><button type="button" role="tab" id="tab-secs" aria-controls="p-secs" aria-selected="false" tabindex="-1">Análisis detallado de secciones censales</button></nav>
  <div class="panel" id="p-mun" role="tabpanel" aria-labelledby="tab-mun">
  <div class="mapwrap" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <section class="card mapcol">
      <h2 id="mapt">Mapa por secciones censales</h2>
      <div class="seg2" role="group" aria-label="Nivel del mapa" id="lvl"><button type="button" id="vSec" aria-pressed="true">Secciones censales</button><button type="button" id="vMun" aria-pressed="false">Municipios de la provincia</button></div>
      <div class="toolrow" id="colrow"><label class="fld"><span class="lbl">Color</span><select id="colSel"></select></label></div>
      <p class="note" id="mapn" style="margin-top:8px"></p>
      <svg class="pmap sec" id="pmap" role="img" aria-label="Mapa del municipio"></svg>
      <div class="leg2" id="mleg"></div>
      <p class="mapnote" id="mapnote"></p>
    </section>
    <section class="card pd" id="pd"></section>
  </div>
  </div>
  <div class="panel" id="p-secs" role="tabpanel" aria-labelledby="tab-secs" hidden>
  <section class="card" id="pbcard"></section>
  <div class="cols one">
    <section class="card">
      <h2 id="stt">Secciones censales</h2>
      <p class="note" id="stn">Cada fila es una sección censal (distrito + sección). Pasa el ratón por una fila para resaltarla en el mapa; ordena con las cabeceras.</p>
      <div class="tw tall"><table class="pt mt mun" id="stab"></table></div>
    </section>
  </div>
  </div>
  <div class="notes" id="notes"></div>
</div>
<div class="tt" id="tt"></div>
<script src="js/lib.js"></script>
<script>
const MID = (() => { let m = Q.get('m') || DEF_MUN; return /^\d{5}$/.test(m) ? m : DEF_MUN })();
const PID = MID.slice(0, 2), C3 = MID.slice(2), AUTO = !!AUTONOMAS[PID];
let P, PD, SECJ = null, SECD = null, MUNJ, M = [], MU, S = [], VIEW = 'sec', ELV = Q.get('v') === 'cab' ? 'cab' : 'mun', COL = -1, SORT = { k: 'cus', d: 1 }, ALLP = false, HL = null, PJM = null;
function build() {
  M = PD.m.map(m => { const o = mkMun(m); o.id = PID + o.c3; o.w = win(o.E, o.bl, 'v'); o.locs = m[6]; return o });
  MU = M.find(m => m.c3 === C3);
  const L = MU ? MU.locs : [];
  S = ((SECD && SECD[C3]) || []).map(s => { const E = []; s[4].forEach(([i, v]) => E.push({ i, v, s: 0, n: null })); s[5].forEach(([k, v]) => E.push({ i: LI, v, s: 0, n: L[k] ? L[k][0] : 'Lista local' }));
    const v = vec(E), valid = v.reduce((a, b) => a + b, 0) + s[2]; return { cus: s[0], key: C3 + s[0], censo: s[1], bl: s[2], nu: s[3], E, v, valid, w: win(E, s[2], 'v'), part: s[1] ? (valid + s[3]) / s[1] : 0 } });
}
const secName = c => `Dist. ${c.slice(0, 2)} · Sec. ${c.slice(2)}`;
function colorFn(units) {
  if (COL < 0) return u => (u.w ? shade(u.w.w, u.w.m, 0.30) : '');
  const xs = units.filter(u => u.valid > 0).map(u => u.v[COL] / u.valid), mn = Math.min(...xs), mx = Math.max(...xs), r = mx - mn || 1;
  return u => u.valid > 0 ? `fill:${pcol(COL)};fill-opacity:${(0.08 + 0.92 * (u.v[COL] / u.valid - mn) / r).toFixed(2)}` : '';
}
function legend(units) {
  if (COL < 0) { const used = new Set(units.filter(u => u.w).map(u => u.w.w)); $('#mleg').innerHTML = [...used].sort((a, b) => a - b).map(i => `<span><i style="background:${pcol(i)}"></i>${esc(pname(i))}</span>`).join('') + '<span>Más pálido = ventaja más corta</span>'; return }
  const xs = units.filter(u => u.valid > 0).map(u => u.v[COL] / u.valid), mn = Math.min(...xs), mx = Math.max(...xs);
  $('#mleg').innerHTML = `<span>${fmt(mn)}</span><span style="display:inline-block;width:120px;height:10px;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,${pcol(COL)} 8%,transparent),${pcol(COL)})"></span><span>${fmt(mx)} · % de ${esc(pname(COL))}</span>`;
}
function map() {
  const svg = $('#pmap'); hoverFront(svg); $('#vSec').setAttribute('aria-pressed', VIEW === 'sec'); $('#vMun').setAttribute('aria-pressed', VIEW === 'mun');
  $('#mapt').textContent = VIEW === 'sec' ? 'Mapa por secciones censales' : 'Mapa por municipios de la provincia';
  svg.classList.toggle('sec', VIEW === 'sec'); svg.classList.toggle('munmap', VIEW === 'mun');
  if (VIEW === 'sec') {
    const cf = colorFn(S), shapes = SECJ ? SECJ.s.filter(x => x[0].startsWith(C3)) : [], byKey = {}; S.forEach(s => byKey[s.key] = s);
    if (!shapes.length) { svg.innerHTML = ''; $('#mapn').textContent = ''; $('#mleg').innerHTML = ''; $('#mapnote').innerHTML = '<span class="sorry">No hay mapa de secciones disponible para este municipio. Prueba la vista «Municipios de la provincia».</span>'; return }
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.innerHTML = '<g id="gm">' + shapes.map(([k, d]) => { const s = byKey[k]; if (!s) return `<path class="nd" d="${d}"><title>${secName(k.slice(3))} · sin datos de votos</title></path>`;
      return `<path d="${d}" data-k="${k}" style="${cf(s)}"><title>${secName(s.cus)} · ${s.w ? esc(en(s.w.e)) + ' ' + fmt(s.w.sh) + ' · ventaja ' + nf(s.w.m * 100, 1) + ' pts' : 'sin votos'}${COL >= 0 ? ' · ' + esc(pname(COL)) + ' ' + fmt(s.v[COL] / s.valid) : ''} · ${nf(s.censo)} electores</title></path>` }).join('') + '</g>';
    const bb = $('#gm').getBBox(), pad = Math.max(bb.width, bb.height) * 0.03;
    svg.setAttribute('viewBox', `${bb.x - pad} ${bb.y - pad} ${bb.width + 2 * pad} ${bb.height + 2 * pad}`);
    $('#mapn').textContent = COL < 0 ? 'Color: candidatura más votada en cada sección; cuanto más pálido, menor la ventaja sobre la segunda. Las listas locales se pintan en gris.' : `Color: % de voto de ${pname(COL)} en cada sección (más intenso = mayor porcentaje dentro de este municipio).`;
    legend(S);
    const missing = S.filter(s => !shapes.some(x => x[0] === s.key)).length;
    $('#mapnote').innerHTML = missing ? `${missing} ${missing === 1 ? 'sección' : 'secciones'} sin polígono en el seccionado del INE de ${G.mapyear}${G.year < 2007 ? ' (el más antiguo disponible)' : ''}: sus votos cuentan en el municipio y en la tabla.` : '';
    const oldp = document.getElementById('upanel'); if (oldp) oldp.remove();
    attachPanel(svg, 'path[data-k]', 'k', k => { const s = byKey[k]; if (!s) return null;
      return { title: secName(s.cus), meta: `${esc(MU.n)} · ${nf(s.censo)} electores`, E: s.E, bl: s.bl, nu: s.nu, censo: s.censo, ref: { v: MU.v, bl: MU.bl }, refName: 'el municipio' } }, 'Pasa el ratón por una sección censal para ver su voto al detalle. Pulsa para fijarla.');
  } else {
    const oldp = document.getElementById('upanel'); if (oldp) oldp.remove();
    const cf = colorFn(M.filter(u => u.w));
    svg.setAttribute('viewBox', `0 0 ${MUNJ.w} ${MUNJ.h}`);
    svg.innerHTML = MUNJ.ms.map(([c3, name, d]) => { const m = M.find(x => x.c3 === c3); if (!m || !m.w) return `<path class="nd" d="${d}"><title>${esc(name)}</title></path>`;
      return `<path class="${c3 === C3 ? 'cur' : 'ctx'}" d="${d}" style="${cf(m)}" data-m="${m.id}" tabindex="0" role="link" aria-label="${esc(name)}"><title>${esc(name)} · ${esc(en(m.w.e))} ${fmt(m.w.sh)} · ventaja ${nf(m.w.m * 100, 1)} pts</title></path>` }).join('');
    const cur = svg.querySelector('path.cur'); if (cur) svg.appendChild(cur);
    svg.querySelectorAll('path[data-m]').forEach(p => { const go = () => { if (p.dataset.m !== MID) nav(hMun(p.dataset.m)) }; p.onclick = go; p.onkeydown = e => { if (e.key === 'Enter') go() } });
    $('#mapn').textContent = (COL < 0 ? 'Color: candidatura más votada en cada municipio de la provincia' : `Color: % de voto de ${pname(COL)} en cada municipio`) + `. El municipio de ${MU.n} aparece con el borde marcado; pulsa otro para cambiar.`;
    legend(M.filter(m => m.w)); $('#mapnote').textContent = MUNJ.ms.some(x => x[0] === C3) ? '' : 'Este municipio no figura en los límites municipales actuales (desaparecido o fusionado): sus votos cuentan en la tabla y en la provincia.';
  }
}
/* ---- vista de cabildo insular dentro del municipio ---- */
function mapCab() {
  const svg = $('#pmap'); $('#mapt').textContent = 'Cabildos de la provincia';
  svg.classList.remove('sec'); svg.classList.add('munmap'); svg.classList.add('nob');
  const used = new Map();
  if (!PJM || !PJM.i) { svg.innerHTML = ''; $('#mapn').textContent = ''; return }
  svg.setAttribute('viewBox', `0 0 ${PJM.w} ${PJM.h}`);
  svg.innerHTML = Object.keys(PJM.i).map(iid => { const g = govOf('c' + iid), c = PD.cab.find(x => x[0] === iid), tip = `${ISLN[iid]}${g ? ' · gobierno: ' + g.parts.map(p => p.n).join(' + ') : ''}`; if (g) g.parts.forEach(p => used.set(p.i, p.n));
    return `<path class="${iid === MU.isl ? 'cur' : 'ctx'}" d="${PJM.i[iid]}" data-c="${iid}" tabindex="0" role="link" style="fill:${govFill(g, 8)}"><title>${esc('Cabildo de ' + tip)}</title></path>` }).join('');
  const cur = svg.querySelector('path.cur'); if (cur) svg.appendChild(cur);
  svg.querySelectorAll('path[data-c]').forEach(p => { const go = () => nav(hCab(p.dataset.c)); p.onclick = go; p.onkeydown = e => { if (e.key === 'Enter') go() } });
  $('#mapn').textContent = 'Color: partido o partidos que gobiernan cada cabildo (rayas si es una coalición). El cabildo de este municipio aparece con el borde marcado; pulsa uno para ver su cabildo.';
  $('#mleg').innerHTML = [...used.keys()].map(i => `<span><i style="background:${pcol(i)}"></i>${esc(used.get(i))}</span>`).join('');
  $('#mapnote').textContent = '';
  const oldp = document.getElementById('upanel'); if (oldp) oldp.remove();
}
function detailCab() {
  const c = PD.cab.find(x => x[0] === MU.isl), cb = MU.cab, E = cb ? cb.E : [], valid = E.reduce((a, e) => a + e.v, 0) + (cb ? cb.bl : 0);
  const ie = ents(c[6], c[7]), ivalid = ie.reduce((a, e) => a + e.v, 0) + c[4], g = govOf('c' + c[0]);
  const rows = E.slice().sort((a, b) => b.v - a.v).filter(e => e.v > 0).slice(0, 14);
  const w = win(E, cb ? cb.bl : 0, 'v');
  $('#pd').innerHTML = `<h3>${esc(MU.n)}: elecciones al Cabildo de ${esc(c[1])}</h3><div class="meta">Votos emitidos en el municipio para el cabildo · ${nf(valid)} votos válidos</div>
  ${cb ? `<div class="kpis k4"><div><b>${w ? esc(en(w.e)) : '–'}</b><span>más votado en el municipio${w ? ` (${fmt(w.sh)})` : ''}</span></div><div><b>${nf(cb.bl)}</b><span>votos en blanco</span></div><div><b>${nf(cb.nu)}</b><span>votos nulos</span></div></div>
  <div class="tw"><table class="pt mt prt vt"><thead><tr><th>Candidatura</th><th>Votos</th><th>% voto</th><th>% en la isla</th><th>Dif.</th></tr></thead><tbody>${rows.map(e => { const ie2 = ie.find(x => x.i === e.i && x.n === e.n), isl = ie2 ? ie2.v / ivalid : 0, d = e.v / valid - isl; return `<tr><td>${wnE(e)}</td><td class="num">${nf(e.v)}</td><td class="num"><b>${fmt(e.v / valid)}</b></td><td class="num">${fmt(isl)}</td><td class="num"><span class="${d >= 0 ? 'gd' : 'bd'}">${pts(d) || '0,0'}</span></td></tr>` }).join('')}</tbody></table></div>` : '<p class="note">No hay desglose por municipio de esta elección al cabildo.</p>'}
  <p class="lbl" style="margin:14px 0 2px">Resultado del cabildo (toda la isla)</p>${seatBar(seatList(ie), c[2])}${govHTML(g)}
  <p style="margin:14px 0 0" class="navbtns"><a class="btnlk" href="${hCab(c[0])}">Ver el Cabildo de ${esc(c[1])} →</a><a class="btnlk ghost" href="${hProv(PID)}">← Provincia de ${esc(P.n)}</a></p>`;
}
function hl(k) {
  HL = k; document.querySelectorAll('#pmap path.hl').forEach(p => p.classList.remove('hl')); document.querySelectorAll('#stab tr.hl').forEach(p => p.classList.remove('hl'));
  if (!k) return; const p = document.querySelector(`#pmap path[data-k="${k}"]`); if (p) { p.classList.add('hl'); p.parentNode.appendChild(p) }
  const r = document.querySelector(`#stab tr[data-k="${k}"]`); if (r) r.classList.add('hl');
}
function detail() {
  const m = MU, pa = shares(P.v, P.bl), ma = shares(m.v, m.bl), vt = m.valid + m.nu;
  const E = m.E.filter(e => e.v > 0).sort((a, b) => b.v - a.v), ns = m.E.reduce((a, e) => a + e.s, 0);
  let ks = E.filter((e, k) => e.v / ma.valid >= 0.005 || k < 6 || e.s > 0); if (ALLP) ks = E;
  const w = m.w, t2 = w && w.se ? w.se : null;
  $('#pd').innerHTML = `<h3>${esc(m.n)}</h3><div class="meta">${AUTO ? 'Ciudad autónoma' : 'Provincia de ' + esc(P.n)} · código INE ${MID} · ${nf(ma.valid)} votos válidos · ${nf(ns)} concejales</div>
  <div class="kpis k4"><div><b>${fmt(vt / m.censo)}</b><span>participación (${nf(vt)} votantes de ${nf(m.censo)} electores)</span></div>
  <div><b>${w ? esc(en(w.e)) : '–'}</b><span>más votado, con ${w ? fmt(w.sh) : '–'} (${w ? nf(w.e.v) : '–'} votos)</span></div>
  <div><b>${w && t2 ? nf(w.e.v - t2.v) : '–'}</b><span>votos de ventaja sobre ${t2 ? esc(en(t2)) : '–'}${w && t2 ? ` (${nf(w.m * 100, 1)} pts)` : ''}</span></div>
  <div><b>${fmt(m.bl / ma.valid)}</b><span>voto en blanco (${nf(m.bl)}) · ${nf(m.nu)} votos nulos</span></div></div>
  ${ns ? seatBar(seatList(m.E), ns) : ''}
  <div class="tw"><table class="pt mt prt vt"><thead><tr><th>Candidatura</th><th>Votos</th><th>% voto</th><th>Concejales</th>${AUTO ? '' : '<th>% provincia</th><th>Dif.</th>'}</tr></thead><tbody>${ks.map(e => { const loc = !!e.n, pr = loc ? null : pa.row[e.i], d = pr === null ? null : ma.row[e.i] - pr;
    return `<tr><td>${wnE(e)}</td><td class="num">${nf(e.v)}</td><td class="num"><b>${fmt(e.v / ma.valid)}</b></td><td class="num s2">${e.s || '–'}</td>${AUTO ? '' : `<td class="num">${pr === null ? '–' : fmt(pr)}</td><td class="num">${d === null ? '–' : `<span class="${d >= 0 ? 'gd' : 'bd'}">${pts(d) || '0,0'}</span>`}</td>`}</tr>` }).join('')}</tbody></table></div>
  <p style="margin:10px 0 0"><button type="button" class="ghost" id="allp">${ALLP ? 'Mostrar solo las principales' : 'Mostrar todas las candidaturas'}</button></p>
  ${AUTO ? '' : `<p class="note" style="margin:10px 0 0">«Dif.» es la diferencia en puntos entre el % del municipio y el de toda la provincia (verde: va mejor en el municipio). Las listas locales solo existen en este municipio, por lo que no se comparan.</p>`}
  <p style="margin:14px 0 0" class="navbtns">${AUTO ? '' : `<a class="btnlk ghost" href="${hProv(PID)}">← Provincia de ${esc(P.n)}</a>`}</p>`;
  $('#allp').onclick = () => { ALLP = !ALLP; detail() };
}
let PBS;
function pblock() {
  const ps = MU.v.map((x, i) => i).filter(i => S.some(s => s.v[i] > 0)).sort((a, b) => MU.v[b] - MU.v[a]);
  partyBlock($('#pbcard'), { state: PBS = PBS || { party: ps[0], ord: 'pct_desc' }, ps, units: S.map(s => ({ key: s.key, name: secName(s.cus), censo: s.censo, part: s.part, v: s.v, bl: s.bl, nu: s.nu })), parent: { v: MU.v, bl: MU.bl }, parentName: 'del municipio',
    unitName: 'Sección', unitsPl: 'secciones censales', note: 'El número junto al nombre es su voto en el municipio. Elige un partido y cómo ordenar las secciones censales: la tabla muestra las diez primeras. «Candidaturas locales» suma todas las listas locales.', chipSub: j => nf(MU.v[j]) });
}
function stable() {
  const ps = MU.v.map((x, i) => i).filter(i => S.some(s => s.v[i] > 0)).sort((a, b) => MU.v[b] - MU.v[a]);
  const rows = S.map(s => { const o = { s, cus: s.cus, censo: s.censo, part: s.part, ganador: s.w ? en(s.w.e) : '', sh: s.w ? s.w.sh : 0, margen: s.w ? s.w.m : 0, bl: s.bl, nu: s.nu, pbl: s.valid ? s.bl / s.valid : 0 };
    ps.forEach(i => o['p' + i] = s.valid ? s.v[i] / s.valid : 0); return o });
  const k = SORT.k; rows.sort((a, b) => (typeof a[k] === 'string' ? a[k].localeCompare(b[k], 'es') : a[k] - b[k]) * SORT.d);
  const th = (key, lab, cls = '') => `<th data-s="${key}" ${SORT.k === key ? `aria-sort="${SORT.d > 0 ? 'ascending' : 'descending'}"` : ''} class="${cls}">${lab}</th>`;
  const cell = (sh, v) => `<td class="num pc">${fmt(sh)}<small>${nf(v)}</small></td>`;
  $('#stt').textContent = S.length === 1 ? 'Sección censal' : 'Secciones censales';
  $('#stab').innerHTML = `<thead><tr>${th('cus', 'Sección', 'stk')}${th('censo', 'Electores')}${th('part', 'Particip.')}${th('ganador', 'Más votado')}${th('sh', '% ganador')}${th('margen', 'Ventaja')}${ps.map(i => th('p' + i, `<span class="wn">${swatch(i)}${esc(pname(i))}</span>`)).join('')}${th('pbl', 'En blanco')}${th('nu', 'Nulos')}</tr></thead><tbody>${rows.map(r => `<tr class="rw" data-k="${r.s.key}"><td class="stk">${secName(r.cus)}</td><td class="num">${nf(r.censo)}</td><td class="num">${fmt(r.part)}</td><td>${r.s.w ? wnE(r.s.w.e) : '–'}</td><td class="num">${r.s.w ? fmt(r.sh) : '–'}</td><td class="num">${r.s.w ? nf(r.margen * 100, 1) + ' pts' : '–'}</td>${ps.map(i => cell(r['p' + i], r.s.v[i])).join('')}${cell(r.pbl, r.bl)}<td class="num">${nf(r.nu)}</td></tr>`).join('')}</tbody>`;
  $('#stab').querySelectorAll('th[data-s]').forEach(t => t.onclick = () => { const kk = t.dataset.s; SORT = { k: kk, d: SORT.k === kk ? -SORT.d : (kk === 'cus' || kk === 'ganador' ? 1 : -1) }; stable() });
  $('#stab').querySelectorAll('tr.rw').forEach(t => { t.onmouseenter = () => hl(t.dataset.k); t.onmouseleave = () => hl(null) });
  if (HL) hl(HL);
}
function setCol(v) { COL = v; if (COL >= 0) SORT = { k: 'p' + COL, d: -1 }; else if (/^p\d+$/.test(SORT.k)) SORT = { k: 'cus', d: 1 }; map(); if (S.length) stable() }
function render() {
  const cab = ELV === 'cab' && MU.isl && MU.cab;
  const items = [`<button type="button" data-v="mun" class="${!cab ? 'on' : ''}">Elecciones municipales</button>`];
  if (MU.isl && G.hascab && PD.cab && PD.cab.length) items.push(`<button type="button" data-v="cab" class="${cab ? 'on' : ''}">Cabildo de ${esc(ISLN[MU.isl] || '')}</button>`);
  $('#sw').innerHTML = items.join(''); $('#sw').hidden = items.length < 2;
  $('#sw').querySelectorAll('button').forEach(b => b.onclick = () => { ELV = b.dataset.v; render() });
  if (cab) {
    $('#tabs').hidden = true; $('#p-secs').hidden = true; $('#p-mun').hidden = false; $('#lvl').style.display = 'none'; $('#colrow').style.display = 'none';
    mapCab(); detailCab();
  } else {
    $('#lvl').style.display = ''; $('#colrow').style.display = ''; $('#pmap').classList.remove('nob');
    const hasS = G.sections && S.length;
    $('#tabs').hidden = !hasS; if (!hasS) { VIEW = 'mun'; $('#lvl').style.display = 'none'; showTab('mun') }
    map(); detail(); if (hasS) { stable(); pblock() }
  }
}
(async () => {
  try {
    await loadG(); P = G.prov[G.pi[PID]];
    [PD, MUNJ, SECD] = await Promise.all([loadProv(PID), loadMunMap(PID), loadSec(PID)]);
    SECJ = await loadSecMap(PID);
    build(); if (!MU) throw new Error('Municipio no encontrado en esta elección: ' + MID);
    if (G.hascab && MU.isl) PJM = await loadPJMap(PID);
    setPill(); document.title = MU.n + ' · resultados por municipio';
    crumbs(AUTO ? [{ t: 'General', h: href('index.html') }, { l: 'Municipio', t: MU.n }] : [{ t: 'General', h: href('index.html') }, { l: 'Provincia', t: P.n, h: hProv(PID) }, { l: 'Municipio', t: MU.n }]);
    await mountBar(PID, `${MU.n} · ${P.n}`); mountTabs();
    const top = MU.v.map((x, i) => i).filter(i => MU.v[i] > 0).sort((a, b) => MU.v[b] - MU.v[a]).slice(0, 12);
    $('#colSel').innerHTML = '<option value="-1">Candidatura más votada</option>' + top.map(i => `<option value="${i}">% de ${esc(pname(i))}</option>`).join('');
    $('#colSel').onchange = e => setCol(+e.target.value);
    $('#vSec').onclick = () => { VIEW = 'sec'; map() }; $('#vMun').onclick = () => { VIEW = 'mun'; map() };
    render();
    $('#notes').innerHTML = notesHTML();
  } catch (e) { console.error(e); $('#notes').textContent = 'No se pudieron cargar los datos: ' + e }
})();
</script>
</body>
